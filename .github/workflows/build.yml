name: Build SnipLab

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests (no GUI needed)
        run: python -m unittest discover -s tests -v

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Build exe
        run: pyinstaller --noconfirm --windowed --onefile --name SnipLab --paths src run_sniplab.py
      - uses: actions/upload-artifact@v4
        with:
          name: SnipLab-windows
          path: dist/SnipLab.exe
      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SnipLab.exe
